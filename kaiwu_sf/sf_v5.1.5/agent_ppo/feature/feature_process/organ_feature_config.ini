[feature_config]
is_alive = one_hot:1:eq
belong_to_main_camp = one_hot:1:eq
location_x = min_max:-41000:41000
location_z = min_max:-41000:41000
relative_location_x = min_max:0:1
relative_location_z = min_max:0:1
hp_rate = min_max:0:1
enemy_tower_hp_rate = min_max:0:1
enemy_tower_hp_discrete = one_hot:0:1:2:eq
enemy_tower_attack_target = one_hot:0:1:2:eq
dist_to_enemy_tower = min_max:0:1

[feature_functions]
is_alive = is_alive
belong_to_main_camp = belong_to_main_camp
location_x = get_normal_organ_location_x
location_z = get_normal_organ_location_z
relative_location_x = relative_location_x
relative_location_z = relative_location_z
hp_rate = get_hp_rate
enemy_tower_hp_rate = get_enemy_tower_hp_rate
enemy_tower_hp_discrete = get_enemy_tower_hp_discrete
enemy_tower_attack_target = get_enemy_tower_attack_target
dist_to_enemy_tower = get_dist_to_enemy_tower

[ally_feature_config]
ally_tower_hp_rate = min_max:0:1
ally_tower_hp_discrete = one_hot:0:1:2:eq
dist_to_ally_tower = min_max:0:1

[ally_feature_functions]
ally_tower_hp_rate = get_ally_tower_hp_rate
ally_tower_hp_discrete = get_ally_tower_hp_discrete
dist_to_ally_tower = get_dist_to_ally_tower
